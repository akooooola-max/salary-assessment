<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星読みタロット｜Mystic Tarot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#1a1440">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タロット">
  <meta name="description" content="大アルカナ22枚で占う本格タロット占い。今日の運勢・三枚引き・ケルト十字などのスプレッドに対応。">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #0b0820;
      --bg-1: #171043;
      --bg-2: #241a5e;
      --gold: #e8c56a;
      --gold-soft: #f2dfa0;
      --violet: #b18bff;
      --ink: #ede9ff;
      --ink-dim: #b9b2df;
      --card-back: linear-gradient(160deg, #2a1e63 0%, #150e38 100%);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
      background:
        radial-gradient(1200px 700px at 80% -10%, rgba(177,139,255,0.28), transparent 60%),
        radial-gradient(900px 600px at 10% 110%, rgba(232,197,106,0.15), transparent 55%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
      padding: 28px 16px 64px;
      overflow-x: hidden;
      position: relative;
    }

    /* twinkling stars */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #fff; opacity: 0.7;
      animation: twinkle var(--tw, 3s) ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.15; transform: scale(0.6);} 50% { opacity: 0.9; transform: scale(1.1);} }

    .wrap { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }

    header { text-align: center; margin-bottom: 26px; }
    header .mark { font-size: 2rem; letter-spacing: 0.35em; margin-bottom: 4px; }
    header h1 {
      font-size: 1.9rem; font-weight: 700; letter-spacing: 0.12em;
      background: linear-gradient(120deg, var(--gold-soft), var(--gold), var(--violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { color: var(--ink-dim); font-size: 0.82rem; margin-top: 8px; letter-spacing: 0.08em; }

    .panel {
      background: linear-gradient(180deg, rgba(38,26,94,0.55), rgba(18,12,48,0.6));
      border: 1px solid rgba(232,197,106,0.28);
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 24px 22px;
      margin-bottom: 22px;
      backdrop-filter: blur(4px);
    }

    .panel h2 {
      font-size: 0.95rem; letter-spacing: 0.14em; color: var(--gold-soft);
      margin-bottom: 16px; text-align: center; font-weight: 700;
    }

    /* spread selector */
    .spreads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .spread-btn {
      appearance: none; cursor: pointer; text-align: center;
      background: rgba(20,14,52,0.5);
      border: 1px solid rgba(177,139,255,0.3);
      border-radius: 14px; color: var(--ink);
      padding: 16px 8px; font-family: inherit; transition: all 0.22s ease;
    }
    .spread-btn .ic { font-size: 1.5rem; display: block; margin-bottom: 6px; }
    .spread-btn .nm { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.05em; }
    .spread-btn .ds { font-size: 0.68rem; color: var(--ink-dim); margin-top: 4px; }
    .spread-btn:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 22px rgba(0,0,0,0.4); }
    .spread-btn.active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(232,197,106,0.22), rgba(177,139,255,0.14));
      box-shadow: 0 0 0 1px var(--gold) inset, 0 6px 20px rgba(232,197,106,0.2);
    }

    .field { margin-top: 18px; }
    .field label { display: block; font-size: 0.8rem; color: var(--ink-dim); margin-bottom: 8px; letter-spacing: 0.08em; }
    .field input {
      width: 100%; padding: 13px 14px; border-radius: 12px;
      background: rgba(11,8,32,0.6); color: var(--ink);
      border: 1px solid rgba(177,139,255,0.35); font-family: inherit; font-size: 0.95rem;
    }
    .field input::placeholder { color: rgba(185,178,223,0.6); }
    .field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,197,106,0.15); }

    .draw-btn {
      display: block; width: 100%; margin-top: 20px; cursor: pointer;
      padding: 16px; border: none; border-radius: 14px; font-family: inherit;
      font-size: 1.05rem; font-weight: 700; letter-spacing: 0.14em; color: #1a1030;
      background: linear-gradient(120deg, var(--gold-soft), var(--gold));
      box-shadow: 0 8px 24px rgba(232,197,106,0.35); transition: transform 0.18s, box-shadow 0.18s;
    }
    .draw-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(232,197,106,0.5); }
    .draw-btn:active { transform: translateY(0); }
    .draw-btn:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }

    /* results */
    #result { margin-top: 4px; }
    .reading-title { text-align: center; color: var(--gold-soft); font-size: 0.9rem; letter-spacing: 0.12em; margin-bottom: 4px; }
    .reading-q { text-align: center; color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 20px; font-style: italic; }

    .board { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }

    .slot { display: flex; flex-direction: column; align-items: center; width: 150px; }
    .slot .pos { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--violet); margin-bottom: 8px; min-height: 1em; text-align: center; }

    .card {
      width: 130px; height: 220px; perspective: 1000px; cursor: pointer;
      opacity: 0; transform: translateY(18px);
      animation: rise 0.5s ease forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0);} }

    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.8s cubic-bezier(0.4,0.2,0.2,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }

    .face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px solid rgba(232,197,106,0.5);
    }
    .back {
      background: var(--card-back);
      box-shadow: inset 0 0 0 6px rgba(11,8,32,0.6), inset 0 0 0 7px rgba(232,197,106,0.35);
    }
    .back .bk-emblem { font-size: 2.4rem; color: var(--gold); opacity: 0.9; text-shadow: 0 0 12px rgba(232,197,106,0.6); }
    .back::after {
      content: ""; position: absolute; inset: 14px; border-radius: 8px;
      border: 1px solid rgba(232,197,106,0.25);
      background:
        radial-gradient(circle at 50% 30%, rgba(177,139,255,0.25), transparent 55%);
    }

    .front {
      transform: rotateY(180deg);
      background: linear-gradient(170deg, #fbf4e2 0%, #f1e4c4 100%);
      color: #2a1e5e; padding: 10px 8px; text-align: center;
    }
    .front.reversed .fr-art { transform: rotate(180deg); }
    .front .fr-num { font-size: 0.62rem; letter-spacing: 0.15em; color: #8a6d1f; }
    .front .fr-art { font-size: 2.9rem; line-height: 1.1; margin: 6px 0; transition: transform 0.3s; }
    .front .fr-name { font-size: 0.86rem; font-weight: 700; }
    .front .fr-en { font-size: 0.58rem; color: #6b5a2a; letter-spacing: 0.08em; margin-top: 2px; }
    .front .fr-ori {
      margin-top: 8px; font-size: 0.66rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    }
    .front .fr-ori.up { background: rgba(46,125,50,0.15); color: #2e7d32; }
    .front .fr-ori.rev { background: rgba(178,64,64,0.15); color: #b24040; }

    .meaning {
      margin-top: 12px; width: 100%;
      background: rgba(11,8,32,0.5); border: 1px solid rgba(177,139,255,0.25);
      border-radius: 12px; padding: 12px 13px;
      opacity: 0; transition: opacity 0.5s ease;
    }
    .meaning.show { opacity: 1; }
    .meaning .m-kw { font-size: 0.72rem; color: var(--gold-soft); letter-spacing: 0.06em; margin-bottom: 6px; }
    .meaning .m-tx { font-size: 0.78rem; line-height: 1.7; color: var(--ink); }

    .summary {
      margin-top: 24px; padding: 20px; border-radius: 14px;
      background: linear-gradient(180deg, rgba(232,197,106,0.12), rgba(177,139,255,0.08));
      border: 1px solid rgba(232,197,106,0.3);
      opacity: 0; transition: opacity 0.6s ease;
    }
    .summary.show { opacity: 1; }
    .summary h3 { font-size: 0.85rem; color: var(--gold-soft); letter-spacing: 0.12em; margin-bottom: 10px; text-align: center; }
    .summary p { font-size: 0.85rem; line-height: 1.9; color: var(--ink); }

    .actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .ghost-btn {
      cursor: pointer; padding: 12px 22px; border-radius: 12px; font-family: inherit;
      font-size: 0.85rem; letter-spacing: 0.08em;
      background: transparent; color: var(--gold-soft);
      border: 1px solid rgba(232,197,106,0.5); transition: all 0.2s;
    }
    .ghost-btn:hover { background: rgba(232,197,106,0.12); }

    .hint { text-align: center; color: var(--ink-dim); font-size: 0.75rem; margin-top: 14px; letter-spacing: 0.05em; }

    footer { text-align: center; color: rgba(185,178,223,0.5); font-size: 0.68rem; margin-top: 36px; letter-spacing: 0.06em; }

    @media (max-width: 560px) {
      .spreads { grid-template-columns: 1fr; }
      .spread-btn { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; }
      .spread-btn .ic { margin: 0; }
      header h1 { font-size: 1.5rem; }
      .slot { width: 132px; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="wrap">
    <header>
      <div class="mark">☾ ✶ ☽</div>
      <h1>星読みタロット</h1>
      <p>MYSTIC TAROT ・ 大アルカナ22枚が導く、あなたへのメッセージ</p>
    </header>

    <section class="panel" id="setup">
      <h2>◇ スプレッドを選ぶ ◇</h2>
      <div class="spreads" id="spreads"></div>

      <div class="field">
        <label for="question">占いたいこと（任意）</label>
        <input type="text" id="question" placeholder="例：今の恋の行方は？　仕事で進むべき道は？" maxlength="60" autocomplete="off">
      </div>

      <button class="draw-btn" id="drawBtn">カードを引く</button>
      <p class="hint">静かに願いを思い浮かべながら、ボタンを押してください。</p>
    </section>

    <section id="result"></section>
  </div>

  <footer>星読みタロット ・ 娯楽目的のアプリです ・ オフラインでご利用いただけます</footer>

  <script>
  /* ============ 大アルカナ 22枚 ============ */
  const DECK = [
    { n:0,  name:"愚者",       en:"The Fool",           art:"🃏", up:{kw:"自由・出発・可能性", tx:"新しい冒険の始まり。既成概念にとらわれず、まっさらな心で一歩を踏み出す時。無邪気さと好奇心があなたを未知の世界へ導きます。"}, rev:{kw:"無計画・軽率・不安", tx:"準備不足のまま突き進むと足元をすくわれそう。無責任さや優柔不断に注意し、一度立ち止まって計画を見直しましょう。"} },
    { n:1,  name:"魔術師",     en:"The Magician",       art:"🪄", up:{kw:"創造・意志・才能", tx:"必要なものはすでに手の中に。強い意志と行動力で、望みを形にできる絶好の時。あなたの才能が発揮されます。"}, rev:{kw:"迷い・停滞・悪用", tx:"目的を見失っていませんか。技術や言葉を誤った方向に使うと信頼を失います。基本に立ち返りましょう。"} },
    { n:2,  name:"女教皇",     en:"The High Priestess", art:"🌙", up:{kw:"直感・知性・神秘", tx:"理屈よりも直感が真実を告げています。静けさの中に答えあり。知的で冷静な判断が幸運を呼びます。"}, rev:{kw:"感情的・秘密・不調和", tx:"感情に流されて本質を見失いがち。内なる声を無視すると誤解が生まれます。心を整えて。"} },
    { n:3,  name:"女帝",       en:"The Empress",        art:"🌷", up:{kw:"豊かさ・愛情・実り", tx:"愛と豊穣の象徴。努力が実を結び、心満たされる時。周囲への慈しみがさらなる幸福を育てます。"}, rev:{kw:"依存・浪費・停滞", tx:"愛情過多や甘えが関係をこじらせるかも。浪費や怠惰にも注意。自立の意識を取り戻して。"} },
    { n:4,  name:"皇帝",       en:"The Emperor",        art:"♛", up:{kw:"安定・責任・統率", tx:"確固たる意志とリーダーシップで物事を支配できる時。責任を果たすことで信頼と地位が築かれます。"}, rev:{kw:"独善・頑固・支配", tx:"力で押さえつけようとすると反発を招きます。柔軟さを欠いた頑固さは孤立の元。"} },
    { n:5,  name:"教皇",       en:"The Hierophant",     art:"⛪", up:{kw:"信頼・教え・道徳", tx:"良き師や助言者に恵まれる時。伝統やルールを尊重することで正しい道が開けます。誠実さが鍵。"}, rev:{kw:"束縛・偽善・不信", tx:"形式にとらわれすぎて窮屈に。信頼できない助言や偽りの権威に惑わされないよう注意。"} },
    { n:6,  name:"恋人",       en:"The Lovers",         art:"💞", up:{kw:"愛・選択・調和", tx:"心が通い合う喜び。大切な選択においては、直感と愛に従うことが正解へ導きます。良縁の予感。"}, rev:{kw:"別離・迷い・誘惑", tx:"心変わりや優柔不断がすれ違いを生みそう。安易な誘惑に流されず、本当の気持ちを見つめて。"} },
    { n:7,  name:"戦車",       en:"The Chariot",        art:"🏇", up:{kw:"勝利・前進・行動", tx:"勢いに乗って突き進む時。強い意志とスピードで目標を勝ち取れます。迷わず前へ。"}, rev:{kw:"暴走・焦り・停滞", tx:"焦りや感情のコントロール不足で空回り。方向性を見失った暴走は禁物。落ち着いて舵を取り直して。"} },
    { n:8,  name:"力",         en:"Strength",           art:"🦁", up:{kw:"勇気・忍耐・克己", tx:"力ずくではなく、優しさと忍耐で困難を乗り越える時。内なる強さがあなたを支えます。"}, rev:{kw:"弱気・不安・自堕落", tx:"自信を失い、衝動に負けそう。無理は禁物ですが、諦めるにはまだ早い。少しずつ心を立て直して。"} },
    { n:9,  name:"隠者",       en:"The Hermit",         art:"🏮", up:{kw:"探求・内省・賢明", tx:"一人静かに向き合うことで真理が見えてくる時。焦らず内面を深め、経験を知恵に変えましょう。"}, rev:{kw:"孤立・頑固・逃避", tx:"閉じこもりすぎて視野が狭くなっていませんか。孤独と孤立は違います。時には人の手を借りて。"} },
    { n:10, name:"運命の輪",   en:"Wheel of Fortune",   art:"☸", up:{kw:"転機・幸運・好機", tx:"運命の歯車が良い方向へ回り出す。訪れたチャンスを逃さず掴めば、大きな飛躍につながります。"}, rev:{kw:"停滞・不運・タイミング", tx:"流れが滞る時。無理に動かず好機を待つのも策。悪循環を断ち切る工夫を。"} },
    { n:11, name:"正義",       en:"Justice",            art:"⚖", up:{kw:"公正・均衡・決断", tx:"公平でバランスの取れた判断が幸運を呼びます。誠実に向き合えば、正当な結果が得られる時。"}, rev:{kw:"不公平・偏り・ごまかし", tx:"偏った判断や不誠実さが問題の元。責任逃れをせず、公正な態度を取り戻しましょう。"} },
    { n:12, name:"吊るされた男", en:"The Hanged Man",    art:"🙃", up:{kw:"忍耐・視点・受容", tx:"今は動けない時。しかしこの停滞は無駄ではありません。発想を転換し、受け入れることで道が開けます。"}, rev:{kw:"徒労・停滞・犠牲", tx:"報われない努力に疲れていませんか。無意味な我慢は手放して。視点を変える勇気が必要です。"} },
    { n:13, name:"死神",       en:"Death",              art:"🦋", up:{kw:"変容・再生・終わり", tx:"一つの終わりは新たな始まり。古いものを手放すことで、生まれ変わりのチャンスが訪れます。"}, rev:{kw:"停滞・執着・恐れ", tx:"変化を恐れて過去にしがみついていませんか。終わらせるべきものを終わらせる決断が必要です。"} },
    { n:14, name:"節制",       en:"Temperance",         art:"🍶", up:{kw:"調和・節度・浄化", tx:"異なるものを上手に調和させることで、穏やかな豊かさが得られます。バランス感覚が幸運の鍵。"}, rev:{kw:"不均衡・浪費・不摂生", tx:"感情や生活のバランスが崩れ気味。無理や過剰を避け、心身を整えることが大切です。"} },
    { n:15, name:"悪魔",       en:"The Devil",          art:"😈", up:{kw:"欲望・束縛・執着", tx:"抗いがたい魅力や欲望に囚われる時。本能に忠実になれる反面、依存や堕落には注意が必要です。"}, rev:{kw:"解放・自制・脱却", tx:"束縛から抜け出す好機。断ち切れなかった悪習や関係を手放し、自由を取り戻せます。"} },
    { n:16, name:"塔",         en:"The Tower",          art:"🗼", up:{kw:"衝撃・崩壊・転換", tx:"突然の出来事で価値観が覆るかも。しかし崩壊の後には、より強固な土台を築くチャンスがあります。"}, rev:{kw:"回避・遅延・余波", tx:"危機を辛うじて回避、あるいは崩壊の余波が続く時。問題の先送りは避け、根本から見直しを。"} },
    { n:17, name:"星",         en:"The Star",           art:"⭐", up:{kw:"希望・理想・癒し", tx:"暗闇に射す一筋の光。希望を持ち続けることで未来が明るく開けます。心が癒され、理想に近づく時。"}, rev:{kw:"失望・現実逃避・停滞", tx:"理想と現実の差に落胆しがち。夢見るだけでなく、地に足をつけた一歩が必要です。"} },
    { n:18, name:"月",         en:"The Moon",           art:"🌕", up:{kw:"不安・幻想・潜在", tx:"物事がはっきりせず、不安や迷いが漂う時。直感を頼りに、隠れた真実を丁寧に見極めましょう。"}, rev:{kw:"回復・解明・安定", tx:"霧が晴れるように不安が和らぐ時。誤解や曖昧さが解消され、心が落ち着きを取り戻します。"} },
    { n:19, name:"太陽",       en:"The Sun",            art:"☀", up:{kw:"成功・喜び・生命力", tx:"最高の幸運を告げるカード。明るいエネルギーに満ち、成功と喜び、そして祝福が訪れます。"}, rev:{kw:"停滞・空元気・遅れ", tx:"幸運は近いものの、少し陰りが。無理な明るさや見栄を張らず、素直な気持ちを大切に。"} },
    { n:20, name:"審判",       en:"Judgement",          art:"📯", up:{kw:"復活・決断・目覚め", tx:"過去がよみがえり、再出発の時。大切な決断や和解のチャンス。眠っていた可能性が目を覚まします。"}, rev:{kw:"後悔・停滞・見送り", tx:"過去への執着やためらいがチャンスを逃す原因に。後悔を手放し、前を向く勇気を。"} },
    { n:21, name:"世界",       en:"The World",          art:"🌍", up:{kw:"完成・達成・統合", tx:"一つのサイクルが見事に完成する時。努力が実を結び、心からの満足と達成感に包まれます。"}, rev:{kw:"未完・停滞・マンネリ", tx:"あと一歩で完成という所での停滞。惰性やマンネリを打破し、最後までやり遂げる意志を持って。"} },
  ];

  /* ============ スプレッド定義 ============ */
  const SPREADS = {
    one:   { icon:"🔮", name:"今日の運勢", desc:"1枚引き", count:1,
             positions:["今日のあなたへ"] },
    three: { icon:"🌗", name:"三枚引き", desc:"過去・現在・未来", count:3,
             positions:["過去","現在","未来"] },
    cross: { icon:"✳", name:"ヘキサ", desc:"状況を多面的に", count:5,
             positions:["現状","課題","本音","周囲","結末"] },
  };

  let selectedSpread = "three";

  /* ---- 背景の星 ---- */
  (function makeStars(){
    const box = document.getElementById('stars');
    const frag = document.createDocumentFragment();
    for (let i=0;i<70;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random()*100 + '%';
      s.style.top = Math.random()*100 + '%';
      s.style.setProperty('--tw', (2+Math.random()*3).toFixed(1)+'s');
      s.style.animationDelay = (Math.random()*3).toFixed(1)+'s';
      const sz = (1+Math.random()*2).toFixed(1);
      s.style.width = sz+'px'; s.style.height = sz+'px';
      frag.appendChild(s);
    }
    box.appendChild(frag);
  })();

  /* ---- スプレッド選択UI ---- */
  const spreadsEl = document.getElementById('spreads');
  Object.entries(SPREADS).forEach(([key, sp]) => {
    const b = document.createElement('button');
    b.className = 'spread-btn' + (key===selectedSpread ? ' active' : '');
    b.dataset.key = key;
    b.innerHTML = `<span class="ic">${sp.icon}</span><span class="nm">${sp.name}</span><span class="ds">${sp.desc}</span>`;
    b.addEventListener('click', () => {
      selectedSpread = key;
      document.querySelectorAll('.spread-btn').forEach(x => x.classList.toggle('active', x.dataset.key===key));
    });
    spreadsEl.appendChild(b);
  });

  /* ---- シャッフル & 抽選 ---- */
  function drawCards(count){
    const idx = [...Array(DECK.length).keys()];
    // Fisher-Yates
    for (let i=idx.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    return idx.slice(0,count).map(i => ({
      card: DECK[i],
      reversed: Math.random() < 0.5
    }));
  }

  function totalFortune(draws){
    // 正位置=1, 逆位置=-1 の合計でざっくり総合運を判定
    const score = draws.reduce((s,d)=> s + (d.reversed ? -1 : 1), 0);
    if (score >= draws.length) return {t:"大吉", msg:"星々があなたを強く後押ししています。自信を持って進んでください。"};
    if (score > 0)             return {t:"吉",   msg:"追い風が吹いています。前向きな行動が良い流れを呼びます。"};
    if (score === 0)           return {t:"中吉", msg:"光と影が拮抗する時。焦らず、バランスを意識して過ごしましょう。"};
    if (score > -draws.length) return {t:"小吉", msg:"少し慎重さが求められる時。立ち止まり、内面と向き合ってみて。"};
    return {t:"凶（転機）", msg:"試練は変容の入口。手放しと見直しが、次の扉を開く鍵になります。"};
  }

  const drawBtn = document.getElementById('drawBtn');
  const resultEl = document.getElementById('result');

  drawBtn.addEventListener('click', () => {
    const sp = SPREADS[selectedSpread];
    const question = document.getElementById('question').value.trim();
    const draws = drawCards(sp.count);
    render(sp, draws, question);
    drawBtn.textContent = "もう一度引く";
    resultEl.scrollIntoView({behavior:'smooth', block:'start'});
  });

  function render(sp, draws, question){
    resultEl.innerHTML = '';

    const title = document.createElement('div');
    title.className = 'reading-title';
    title.textContent = `${sp.icon} ${sp.name} の結果`;
    resultEl.appendChild(title);

    if (question){
      const q = document.createElement('div');
      q.className = 'reading-q';
      q.textContent = `「${question}」`;
      resultEl.appendChild(q);
    }

    const panel = document.createElement('section');
    panel.className = 'panel';

    const board = document.createElement('div');
    board.className = 'board';
    panel.appendChild(board);

    const cardEls = [];

    draws.forEach((d, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';

      const pos = document.createElement('div');
      pos.className = 'pos';
      pos.textContent = sp.positions[i] || '';
      slot.appendChild(pos);

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i*0.12)+'s';
      const ori = d.reversed ? 'rev' : 'up';
      const oriLabel = d.reversed ? '逆位置' : '正位置';
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back"><span class="bk-emblem">✷</span></div>
          <div class="face front ${d.reversed?'reversed':''}">
            <div class="fr-num">ARCANA ${String(d.card.n).padStart(2,'0')}</div>
            <div class="fr-art">${d.card.art}</div>
            <div class="fr-name">${d.card.name}</div>
            <div class="fr-en">${d.card.en}</div>
            <div class="fr-ori ${ori}">${oriLabel}</div>
          </div>
        </div>`;
      slot.appendChild(card);

      const meaning = document.createElement('div');
      meaning.className = 'meaning';
      const m = d.reversed ? d.card.rev : d.card.up;
      meaning.innerHTML = `<div class="m-kw">🔑 ${m.kw}</div><div class="m-tx">${m.tx}</div>`;
      slot.appendChild(meaning);

      board.appendChild(slot);
      cardEls.push({card, meaning});
    });

    // 総合メッセージ
    const summary = document.createElement('div');
    summary.className = 'summary';
    const f = totalFortune(draws);
    summary.innerHTML = `<h3>◇ 総合運：${f.t} ◇</h3><p>${f.msg}</p>`;
    panel.appendChild(summary);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const reveal = document.createElement('button');
    reveal.className = 'ghost-btn';
    reveal.textContent = 'すべてめくる';
    reveal.addEventListener('click', () => cardEls.forEach(c => flip(c)));
    const again = document.createElement('button');
    again.className = 'ghost-btn';
    again.textContent = '↻ 引き直す';
    again.addEventListener('click', () => drawBtn.click());
    actions.append(reveal, again);
    panel.appendChild(actions);

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'カードをタップしてめくり、メッセージを受け取りましょう。';
    panel.appendChild(hint);

    resultEl.appendChild(panel);

    // 個別タップでめくる
    cardEls.forEach(c => {
      c.card.addEventListener('click', () => flip(c));
    });

    // 少し遅れて自動で1枚ずつめくる演出
    cardEls.forEach((c, i) => {
      setTimeout(() => flip(c), 700 + i*450);
    });
  }

  function flip(c){
    if (c.card.classList.contains('flipped')) return;
    c.card.classList.add('flipped');
    setTimeout(() => c.meaning.classList.add('show'), 500);
    // 全部めくれたら総合運を表示
    setTimeout(() => {
      const all = [...document.querySelectorAll('.card')];
      if (all.every(x => x.classList.contains('flipped'))){
        const s = document.querySelector('.summary');
        if (s) s.classList.add('show');
      }
    }, 550);
  }

  /* ---- Service Worker ---- */
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  </script>
</body>
</html>
